project_id = "BannerlordCoop-website"

[api]
enabled = true
# The nightly gateway connects directly through Hyperdrive. Keep its private
# schema out of the generated Supabase Data API.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[functions.control-plane-admin]
verify_jwt = true

[functions.my-servers]
verify_jwt = true

# The start handler verifies the bearer token with Supabase Auth itself.
[functions.patreon-start]
verify_jwt = false

# Browser OAuth callback uses single-use state, not a bearer token.
[functions.patreon-callback]
verify_jwt = false

# Completion independently verifies the logged-in user with Supabase Auth.
[functions.patreon-complete]
verify_jwt = false

# Dedicated closed credential verification, not Supabase JWT authority.
[functions.control-plane-membership-v1]
verify_jwt = false

# Verifies current Supabase user via Auth on every request.
[functions.website-account]
verify_jwt = false
