name: Deploy

on: 
  push:
    branches: [main]

jobs:
  test-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Validate PowerShell installer
        shell: powershell
        run: .\tests\install.Tests.ps1

  build-and-deploy:
    needs: test-installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and Deploy 🔧
        uses: shalzz/zola-deploy-action@v0.15.3
        env:
          PAGES_BRANCH: gh-pages
          TOKEN: ${{ secrets.TOKEN }}
