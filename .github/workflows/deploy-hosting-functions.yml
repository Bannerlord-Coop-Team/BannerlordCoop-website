name: Deploy Supabase hosting APIs

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/deploy-hosting-functions*'
      - '.github/workflows/deploy-hosting-functions.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/deploy-hosting-functions*'
      - '.github/workflows/deploy-hosting-functions.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:supabase:deployment
      - run: node scripts/deploy-hosting-functions.mjs plan

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: supabase-managed-hosting-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Deploy and verify affected functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-hosting-functions.mjs deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-hosting-deployment
          path: supabase-hosting-deployment.json
          if-no-files-found: ignore
          retention-days: 30
